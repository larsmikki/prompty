services:
  promptr:
    image: larsmikki/promptr:latest
    container_name: promptr
    ports:
      - "3060:3060"
    volumes:
      - promptr_data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3060/api/health"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  promptr_data:

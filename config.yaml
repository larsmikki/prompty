version: "3.8"

services:
  prompty:
    container_name: prompty
    image: larsmikki/prompty:latest
    entrypoint: []
    command: ["node", "server/dist/index.js"]
    working_dir: /app
    ports:
      - "3060:3060"
    volumes:
      - prompty_data:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3060/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  prompty_data:
